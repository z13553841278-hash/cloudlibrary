<!-- templates/book/manage.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云图书管理系统 - 图书管理</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 云图书管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/book/search"><i class="bi bi-search"></i> 新书推荐</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/borrow/current"><i class="bi bi-bookmark"></i> 当前借阅</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/borrow/history"><i class="bi bi-clock-history"></i> 借阅记录</a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" href="/book/manage"><i class="bi bi-gear"></i> 图书管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/borrow/manage"><i class="bi bi-list-check"></i> 借阅管理</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span th:text="${session.userName}"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/user/logout"><i class="bi bi-box-arrow-right"></i>
                                    退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-book"></i> 图书管理</h2>
            <a href="/book/add" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> 新增图书
            </a>
        </div>

        <!-- 图书列表 -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>书名</th>
                                <th>作者</th>
                                <th>ISBN</th>
                                <th>分类</th>
                                <th>总册数</th>
                                <th>可借册数</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="book : ${books}">
                                <td th:text="${book.id}"></td>
                                <td th:text="${book.title}"></td>
                                <td th:text="${book.author}"></td>
                                <td th:text="${book.isbn}"></td>
                                <td th:text="${book.category}"></td>
                                <td th:text="${book.totalCopies}"></td>
                                <td th:text="${book.availableCopies}"></td>
                                <td>
                                    <span th:if="${book.status == 1}" class="badge bg-success">可用</span>
                                    <span th:if="${book.status == 0}" class="badge bg-danger">不可用</span>
                                </td>
                                <td>
                                    <a th:href="@{'/book/edit/' + ${book.id}}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-pencil"></i> 编辑
                                    </a>
                                    <form th:action="@{'/book/delete/' + ${book.id}}" method="post"
                                        style="display: inline;" onsubmit="return confirm('确定要删除这本书吗？')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger ms-1">
                                            <i class="bi bi-trash"></i> 删除
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 无图书提示 -->
                <div class="text-center mt-4" th:if="${books == null or books.isEmpty()}">
                    <i class="bi bi-book-x" style="font-size: 3rem; color: #6c757d;"></i>
                    <h5 class="mt-3 text-muted">暂无图书</h5>
                    <a href="/book/add" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> 添加第一本书
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
