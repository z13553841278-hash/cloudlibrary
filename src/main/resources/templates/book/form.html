<!-- templates/book/form.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.id != null} ? '云图书管理系统 - 编辑图书' : '云图书管理系统 - 新增图书'"></title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 云图书管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/book/search"><i class="bi bi-search"></i> 新书推荐</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/borrow/current"><i class="bi bi-bookmark"></i> 当前借阅</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/borrow/history"><i class="bi bi-clock-history"></i> 借阅记录</a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" href="/book/manage"><i class="bi bi-gear"></i> 图书管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/borrow/manage"><i class="bi bi-list-check"></i> 借阅管理</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span th:text="${session.userName}"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/user/logout"><i class="bi bi-box-arrow-right"></i>
                                    退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 th:text="${book.id != null} ? '编辑图书' : '新增图书'"></h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/book/save}" method="post" th:object="${book}">
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label for="title" class="form-label">书名 *</label>
                                <input type="text" class="form-control" id="title" th:field="*{title}" required>
                            </div>

                            <div class="mb-3">
                                <label for="author" class="form-label">作者 *</label>
                                <input type="text" class="form-control" id="author" th:field="*{author}" required>
                            </div>

                            <div class="mb-3">
                                <label for="isbn" class="form-label">ISBN</label>
                                <input type="text" class="form-control" id="isbn" th:field="*{isbn}">
                            </div>

                            <div class="mb-3">
                                <label for="category" class="form-label">分类</label>
                                <select class="form-select" id="category" th:field="*{category}">
                                    <option value="">选择分类</option>
                                    <option value="编程">编程</option>
                                    <option value="框架">框架</option>
                                    <option value="数据库">数据库</option>
                                    <option value="算法">算法</option>
                                    <option value="网络">网络</option>
                                    <option value="操作系统">操作系统</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="totalCopies" class="form-label">总册数 *</label>
                                <input type="number" class="form-control" id="totalCopies" th:field="*{totalCopies}"
                                    min="1" required>
                            </div>

                            <div class="mb-3">
                                <label for="availableCopies" class="form-label">可借册数 *</label>
                                <input type="number" class="form-control" id="availableCopies"
                                    th:field="*{availableCopies}" min="0" required>
                            </div>

                            <div class="mb-3">
                                <label for="status" class="form-label">状态</label>
                                <select class="form-select" id="status" th:field="*{status}">
                                    <option value="1">可用</option>
                                    <option value="0">不可用</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">描述</label>
                                <textarea class="form-control" id="description" th:field="*{description}"
                                    rows="3"></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> 保存
                                </button>
                                <a href="/book/manage" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> 返回
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
