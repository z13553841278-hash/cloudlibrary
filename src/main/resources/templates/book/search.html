<!-- templates/book/search.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云图书管理系统 - 新书推荐</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
    <style>
        .book-card {
            transition: transform 0.2s;
        }

        .book-card:hover {
            transform: translateY(-5px);
        }

        .search-form {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 云图书管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/book/search"><i class="bi bi-search"></i> 新书推荐</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/borrow/current"><i class="bi bi-bookmark"></i> 当前借阅</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/borrow/history"><i class="bi bi-clock-history"></i> 借阅记录</a>
                    </li>
                    <li class="nav-item" th:if="${session.role == 1}">
                        <a class="nav-link" href="/book/manage"><i class="bi bi-gear"></i> 图书管理</a>
                    </li>
                    <li class="nav-item" th:if="${session.role == 1}">
                        <a class="nav-link" href="/borrow/manage"><i class="bi bi-list-check"></i> 借阅管理</a>
                    </li>
                    <li class="nav-item" th:if="${session.role == 1}">
                        <a class="nav-link" href="/user/manage"><i class="bi bi-people"></i> 用户管理</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span th:text="${session.userName}"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/user/logout"><i class="bi bi-box-arrow-right"></i>
                                    退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4"><i class="bi bi-star"></i> 新书推荐</h2>

        <!-- 搜索表单 -->
        <div class="search-form">
            <form th:action="@{/book/search}" method="get" class="row g-3">
                <div class="col-md-3">
                    <input type="text" class="form-control" name="title" th:value="${title}" placeholder="书名">
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control" name="author" th:value="${author}" placeholder="作者">
                </div>
                <div class="col-md-3">
                    <select class="form-select" name="category">
                        <option value="">选择分类</option>
                        <option value="编程" th:selected="${category == '编程'}">编程</option>
                        <option value="框架" th:selected="${category == '框架'}">框架</option>
                        <option value="数据库" th:selected="${category == '数据库'}">数据库</option>
                        <option value="算法" th:selected="${category == '算法'}">算法</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-search"></i> 搜索
                    </button>
                </div>
            </form>
        </div>

        <!-- 图书列表 -->
        <div class="row" th:if="${books != null and !books.isEmpty()}">
            <div class="col-md-4 mb-4" th:each="book : ${books}">
                <div class="card book-card h-100">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${book.title}"></h5>
                        <h6 class="card-subtitle mb-2 text-muted" th:text="'作者: ' + ${book.author}"></h6>
                        <p class="card-text">
                            <small class="text-muted">
                                ISBN: <span th:text="${book.isbn}"></span><br>
                                分类: <span th:text="${book.category}"></span><br>
                                总册数: <span th:text="${book.totalCopies}"></span><br>
                                可借册数: <span th:text="${book.availableCopies}"></span>
                            </small>
                        </p>
                        <p class="card-text flex-grow-1" th:text="${book.description}"></p>
                        <div class="mt-auto">
                            <form th:if="${book.availableCopies > 0}" th:action="@{'/borrow/borrow/' + ${book.id}}"
                                method="post" style="display: inline;">
                                <button type="submit" class="btn btn-success btn-sm">
                                    <i class="bi bi-bookmark-plus"></i> 借阅
                                </button>
                            </form>
                            <span th:if="${book.availableCopies == 0}" class="badge bg-secondary">
                                <i class="bi bi-x-circle"></i> 无库存
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 无图书提示 -->
        <div class="text-center mt-5" th:if="${books == null or books.isEmpty()}">
            <i class="bi bi-book-x" style="font-size: 4rem; color: #6c757d;"></i>
            <h4 class="mt-3 text-muted">暂无图书</h4>
            <p class="text-muted">没有找到符合条件的图书，请尝试其他搜索条件。</p>
        </div>

        <!-- 底部导航 -->
        <div class="text-center mt-4">
            <a href="/" class="btn btn-secondary me-2">
                <i class="bi bi-house"></i> 回首页
            </a>
            <button onclick="history.back()" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i> 回到上一页
            </button>
        </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
