<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
        <title th:text="${userDTO.id == null ? '添加用户' : '编辑用户'}">用户表单</title>
        <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
        <style>
            .form-container {
                max-width: 600px;
                margin: 0 auto;
                padding: 2rem;
                background: #f8f9fa;
                border-radius: 10px;
                box-shadow: 0 2px 10px rgba(0,0,0,.1);
            }
        </style>
    </head>
    <body>
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">用户管理系统</a>
            </div>
        </nav>

        <!-- 主内容 -->
        <div class="container mt-4">
            <div class="form-container">
                <h2 class="text-center mb-4" 
                    th:text="${userDTO.id == null ? '添加用户' : '编辑用户'}">
                    用户表单
                </h2>
                
                <!-- 表单 -->
                <form th:action="@{/user/save}" th:object="${userDTO}" method="post">
                    <input type="hidden" th:field="*{id}" />
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名 *</label>
                        <input type="text" class="form-control" id="username" 
                            th:field="*{userName}" placeholder="请输入用户名">
                        <div class="text-danger" th:if="${#fields.hasErrors('userName')}" 
                            th:errors="*{userName}">用户名错误提示</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">密码 *</label>
                        <input type="password" class="form-control" id="password" 
                            th:field="*{password}" placeholder="请输入密码">
                        <div class="text-danger" th:if="${#fields.hasErrors('password')}" 
                            th:errors="*{password}">密码错误提示</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱 *</label>
                        <input type="email" class="form-control" id="email" 
                            th:field="*{email}" placeholder="example@email.com">
                        <div class="text-danger" th:if="${#fields.hasErrors('email')}" 
                            th:errors="*{email}">邮箱错误提示</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="phone" class="form-label">手机号</label>
                        <input type="text" class="form-control" id="phone" 
                            th:field="*{phone}" placeholder="13800138000">
                        <div class="text-danger" th:if="${#fields.hasErrors('phone')}" 
                            th:errors="*{phone}">手机号错误提示</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="status" class="form-label">状态</label>
                        <select class="form-select" id="status" th:field="*{status}">
                            <option value="1">正常</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>
                    
                    <!-- 错误消息 -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    
                    <!-- 按钮 -->
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary me-md-2">
                            保存
                        </button>
                        <a th:href="@{/user/list}" class="btn btn-secondary">
                            取消
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    </body>
</html>
