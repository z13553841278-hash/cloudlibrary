<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
    <title th:text="${userDTO.id == null ? '添加用户' : '编辑用户'}">用户表单</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            background: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 云图书管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/book/search"><i class="bi bi-search"></i> 新书推荐</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/borrow/current"><i class="bi bi-bookmark"></i> 当前借阅</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/borrow/history"><i class="bi bi-clock-history"></i> 借阅记录</a>
                    </li>
                    <li class="nav-item" th:if="${session.role == 1}">
                        <a class="nav-link" href="/book/manage"><i class="bi bi-gear"></i> 图书管理</a>
                    </li>
                    <li class="nav-item" th:if="${session.role == 1}">
                        <a class="nav-link" href="/borrow/manage"><i class="bi bi-list-check"></i> 借阅管理</a>
                    </li>
                    <li class="nav-item active" th:if="${session.role == 1}">
                        <a class="nav-link" href="/user/manage"><i class="bi bi-people"></i> 用户管理</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span th:text="${session.userName}"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/user/logout"><i class="bi bi-box-arrow-right"></i>
                                    退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="container mt-4">
        <div class="form-container">
            <h2 class="text-center mb-4"
                th:text="${isManageForm || isManageEdit ? (userDTO.id == null ? '管理 - 添加用户' : '管理 - 编辑用户') : (userDTO.id == null ? '添加用户' : '编辑用户')}">
                用户表单
            </h2>

            <!-- 表单 -->
            <form
                th:action="${isManageForm ? @{/user/manage/save} : (isManageEdit ? @{/user/manage/update} : @{/user/save})}"
                th:object="${userDTO}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="username" class="form-label">用户名 *</label>
                    <input type="text" class="form-control" id="username" th:field="*{userName}" placeholder="请输入用户名">
                    <div class="text-danger" th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}">用户名错误提示
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label" th:text="${userDTO.id == null ? '密码 *' : '密码 (留空则不修改)'}">密码
                        *</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}"
                        th:placeholder="${userDTO.id == null ? '请输入密码' : '留空则不修改密码'}">
                    <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">密码错误提示
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">邮箱 *</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}"
                        placeholder="example@email.com">
                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">邮箱错误提示</div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">手机号</label>
                    <input type="text" class="form-control" id="phone" th:field="*{phone}" placeholder="13800138000">
                    <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">手机号错误提示</div>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">角色</label>
                    <select class="form-select" id="role" th:field="*{role}">
                        <option value="0">普通用户</option>
                        <option value="1">管理员</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="status" class="form-label">状态</label>
                    <select class="form-select" id="status" th:field="*{status}">
                        <option value="1">正常</option>
                        <option value="0">禁用</option>
                    </select>
                </div>

                <!-- 错误消息 -->
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- 按钮 -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-primary me-md-2">
                        保存
                    </button>
                    <a th:href="${isManageForm || isManageEdit ? @{/user/manage} : @{/user/list}}"
                        class="btn btn-secondary">
                        取消
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
