<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
        <title>用户详情</title>
        <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
        <style>
            .detail-container {
                max-width: 700px;
                margin: 0 auto;
                padding: 2rem;
                background: #f8f9fa;
                border-radius: 10px;
                box-shadow: 0 2px 10px rgba(0,0,0,.1);
            }
            .user-header {
                background-color: #f0f7ff;
                border-radius: 10px;
                padding: 1.5rem;
                margin-bottom: 1.5rem;
                border-left: 4px solid #0d6efd;
            }
            .detail-card {
                background-color: white;
                border-radius: 8px;
                padding: 1.5rem;
                margin-bottom: 1rem;
                box-shadow: 0 1px 3px rgba(0,0,0,.1);
            }
            .detail-label {
                font-weight: 600;
                color: #495057;
                margin-bottom: 0.25rem;
            }
            .detail-value {
                font-size: 1.1rem;
                color: #212529;
                padding: 0.5rem 0;
                border-bottom: 1px solid #e9ecef;
            }
            .status-active {
                display: inline-block;
                padding: 0.25rem 0.75rem;
                border-radius: 50px;
                background-color: #d1fae5;
                color: #065f46;
                font-weight: 500;
            }
            .status-inactive {
                display: inline-block;
                padding: 0.25rem 0.75rem;
                border-radius: 50px;
                background-color: #fee2e2;
                color: #991b1b;
                font-weight: 500;
            }
            .detail-icon {
                color: #0d6efd;
                margin-right: 0.5rem;
            }
            .action-buttons {
                border-top: 1px solid #dee2e6;
                padding-top: 1.5rem;
                margin-top: 1rem;
            }
        </style>
    </head>
    <body>
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">用户管理系统</a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" th:href="@{/user/list}">
                        <i class="bi bi-arrow-left"></i> 返回列表
                    </a>
                </div>
            </div>
        </nav>

        <!-- 主内容 -->
        <div class="container mt-4">
            <div class="detail-container">
                <!-- 用户头部信息 -->
                <div class="user-header">
                    <div class="d-flex align-items-center">
                        <div class="me-3">
                            <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center" 
                                 style="width: 60px; height: 60px;">
                                <i class="bi bi-person-fill text-white" style="font-size: 2rem;"></i>
                            </div>
                        </div>
                        <div>
                            <h2 class="mb-1" th:text="${userDTO.userName}">用户名</h2>
                            <p class="text-muted mb-0">用户ID: <span th:text="${userDTO.id}">#001</span></p>
                        </div>
                        <div class="ms-auto">
                            <span th:if="${userDTO.status == 1}" class="status-active">
                                <i class="bi bi-check-circle-fill"></i> 正常
                            </span>
                            <span th:if="${userDTO.status == 0}" class="status-inactive">
                                <i class="bi bi-x-circle-fill"></i> 禁用
                            </span>
                        </div>
                    </div>
                </div>
                
                <!-- 用户详情卡片 -->
                <div class="detail-card">
                    <h5 class="mb-3">
                        <i class="bi bi-info-circle-fill detail-icon"></i>基本信息
                    </h5>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="detail-label">用户名</div>
                            <div class="detail-value" th:text="${userDTO.userName}">username</div>
                        </div>
                        <div class="col-md-6">
                            <div class="detail-label">注册时间</div>
                            <div class="detail-value">
                                <!-- 使用安全的日期格式化方式 -->
                                <span th:if="${userDTO.createTime != null}" th:text="${#temporals.format(userDTO.createTime, 'yyyy-MM-dd HH:mm')}">
                                    2023-01-01 10:30
                                </span>
                                <span th:if="${userDTO.createTime == null}">-</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="detail-label">邮箱</div>
                            <div class="detail-value">
                                <i class="bi bi-envelope"></i>
                                <span th:text="${userDTO.email}">example@email.com</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="detail-label">手机号</div>
                            <div class="detail-value">
                                <i class="bi bi-telephone"></i>
                                <span th:text="${userDTO.phone != null ? userDTO.phone : '未填写'}">13800138000</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="detail-label">状态</div>
                            <div class="detail-value">
                                <span th:if="${userDTO.status == 1}">
                                    <i class="bi bi-check-circle text-success"></i> 正常
                                </span>
                                <span th:if="${userDTO.status == 0}">
                                    <i class="bi bi-x-circle text-danger"></i> 禁用
                                </span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="detail-label">最后更新时间</div>
                            <div class="detail-value">
                                <!-- 使用安全的日期格式化方式 -->
                                <span th:if="${userDTO.updateTime != null}" th:text="${#temporals.format(userDTO.updateTime, 'yyyy-MM-dd HH:mm')}">
                                    2023-01-01 10:30
                                </span>
                                <span th:if="${userDTO.updateTime == null}">-</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 其他信息卡片 -->
                <div class="detail-card">
                    <h5 class="mb-3">
                        <i class="bi bi-shield-check detail-icon"></i>安全信息
                    </h5>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="detail-label">密码状态</div>
                            <div class="detail-value">
                                <i class="bi bi-lock"></i> 已设置
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="action-buttons">
                    <div class="d-flex justify-content-between">
                        <div>
                            <a th:href="@{/user/list}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> 返回列表
                            </a>
                        </div>
                        <div>
                            <a th:href="@{/user/edit/{id}(id=${userDTO.id})}" class="btn btn-primary me-2">
                                <i class="bi bi-pencil-square"></i> 编辑用户
                            </a>
                            <button class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
                                <i class="bi bi-trash"></i> 删除用户
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 删除确认模态框 -->
        <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteModalLabel">确认删除用户</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>确定要删除用户 "<strong th:text="${userDTO.userName}">用户名</strong>" 吗？</p>
                        <p class="text-danger"><i class="bi bi-exclamation-triangle"></i> 此操作无法撤销，所有相关数据将被永久删除。</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <form th:action="@{/user/delete/{id}(id=${userDTO.id})}" method="post" style="display: inline;">
                            <button type="submit" class="btn btn-danger">确认删除</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    </body>
</html>
