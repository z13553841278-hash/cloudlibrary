<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
        <title>用户列表</title>
        <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
        <style>
            .status-active { color: #28a745; }
            .status-inactive { color: #dc3545; }
        </style>
    </head>
    <body>
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">用户管理系统</a>
                <div class="navbar-nav">
                    <a class="nav-link active" href="#">用户管理</a>
                </div>
                <div class="d-flex">
                    <!-- 显示登录用户信息 -->
                    <div class="user-info" th:if="${loginUser}">
                        <i class="bi bi-person-circle"></i>
                        欢迎，<span th:text="${loginUser.userName}">用户</span>
                    </div>
                    <a th:href="@{/user/logout}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right"></i> 退出
                    </a>
                </div>
            </div>
        </nav>

        <!-- 主内容 -->
        <div class="container mt-4">
            <!-- 标题和按钮 -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>用户列表</h2>
                <a th:href="@{/user/add}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> 添加用户
                </a>
            </div>
            
            <!-- 统计信息 -->
            <div class="alert alert-info">
                <i class="bi bi-info-circle"></i> 当前共有 <strong th:text="${userCount}">0</strong> 个用户
            </div>
            
            <!-- 用户表格 -->
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>邮箱</th>
                            <th>手机号</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.userName}"></td>
                            <td th:text="${user.email}"></td>
                            <td th:text="${user.phone}"></td>
                            <td>
                                <span th:if="${user.status == 1}" class="status-active">
                                    <i class="bi bi-check-circle"></i> 正常
                                </span>
                                <span th:if="${user.status == 0}" class="status-inactive">
                                    <i class="bi bi-x-circle"></i> 禁用
                                </span>
                            </td>
                            <td th:text="${#temporals.format(user.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                            <td>
                                <a th:href="@{/user/detail/{id}(id=${user.id})}" 
                                class="btn btn-sm btn-info">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/user/edit/{id}(id=${user.id})}" 
                                class="btn btn-sm btn-warning">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/user/delete/{id}(id=${user.id})}" 
                                class="btn btn-sm btn-danger"
                                onclick="return confirm('确定删除此用户吗？')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- 返回按钮 -->
            <div class="mt-3">
                <a th:href="@{/}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> 返回首页
                </a>
            </div>
        </div>

        <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    </body>
</html>
