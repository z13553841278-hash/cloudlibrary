<!-- templates/borrow/manage.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云图书管理系统 - 借阅管理</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 云图书管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/book/search"><i class="bi bi-search"></i> 新书推荐</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/borrow/current"><i class="bi bi-bookmark"></i> 当前借阅</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/borrow/history"><i class="bi bi-clock-history"></i> 借阅记录</a>
                    </li>
                    <li class="nav-item" th:if="${session.role == 1}">
                        <a class="nav-link" href="/book/manage"><i class="bi bi-gear"></i> 图书管理</a>
                    </li>
                    <li class="nav-item active" th:if="${session.role == 1}">
                        <a class="nav-link" href="/borrow/manage"><i class="bi bi-list-check"></i> 借阅管理</a>
                    </li>
                    <li class="nav-item" th:if="${session.role == 1}">
                        <a class="nav-link" href="/user/manage"><i class="bi bi-people"></i> 用户管理</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> <span th:text="${session.userName}"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/user/logout"><i class="bi bi-box-arrow-right"></i>
                                    退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4"><i class="bi bi-list-check"></i> 借阅管理</h2>

        <!-- 新增借阅记录 -->
        <div class="card mb-4">
            <div class="card-header">
                <h5><i class="bi bi-plus-circle"></i> 新增借阅记录</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/borrow/add}" method="post">
                    <div class="row">
                        <div class="col-md-4">
                            <label for="userId" class="form-label">用户ID</label>
                            <input type="number" class="form-control" id="userId" name="userId" required>
                        </div>
                        <div class="col-md-4">
                            <label for="bookId" class="form-label">图书ID</label>
                            <input type="number" class="form-control" id="bookId" name="bookId" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">&nbsp;</label>
                            <button type="submit" class="btn btn-success w-100">
                                <i class="bi bi-plus"></i> 添加借阅
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- 借阅记录列表 -->
        <div class="card" th:if="${borrowRecords != null and !borrowRecords.isEmpty()}">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>用户</th>
                                <th>图书名称</th>
                                <th>作者</th>
                                <th>借阅日期</th>
                                <th>应还日期</th>
                                <th>实际归还日期</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="record : ${borrowRecords}">
                                <td th:text="${record.user != null ? record.user.userName : '未知'}"></td>
                                <td th:text="${record.book != null ? record.book.title : '未知'}"></td>
                                <td th:text="${record.book != null ? record.book.author : '未知'}"></td>
                                <td th:text="${#temporals.format(record.borrowDate, 'yyyy-MM-dd')}"></td>
                                <td th:text="${#temporals.format(record.dueDate, 'yyyy-MM-dd')}"></td>
                                <td>
                                    <span th:if="${record.returnDate != null}"
                                        th:text="${#temporals.format(record.returnDate, 'yyyy-MM-dd')}"></span>
                                    <span th:if="${record.returnDate == null}" class="text-muted">-</span>
                                </td>
                                <td>
                                    <span th:if="${record.status == 0}" class="badge bg-primary">借阅中</span>
                                    <span th:if="${record.status == 1}" class="badge bg-success">已归还</span>
                                    <span th:if="${record.status == 2}" class="badge bg-warning">逾期</span>
                                </td>
                                <td>
                                    <form th:if="${record.status == 2}" th:action="@{'/borrow/confirm/' + ${record.id}}"
                                        method="post" onsubmit="return confirm('确定要确认归还吗？')">
                                        <button type="submit" class="btn btn-warning btn-sm">
                                            <i class="bi bi-check-circle"></i> 确认归还
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 无借阅记录提示 -->
        <div class="text-center mt-5" th:if="${borrowRecords == null or borrowRecords.isEmpty()}">
            <i class="bi bi-list-check" style="font-size: 4rem; color: #6c757d;"></i>
            <h4 class="mt-3 text-muted">暂无借阅记录</h4>
            <p class="text-muted">系统中还没有任何借阅记录。</p>
        </div>

        <!-- 底部导航 -->
        <div class="text-center mt-4">
            <a href="/" class="btn btn-secondary me-2">
                <i class="bi bi-house"></i> 回首页
            </a>
            <button onclick="history.back()" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i> 回到上一页
            </button>
        </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
